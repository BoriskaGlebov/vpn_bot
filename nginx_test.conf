# ---------------------------------------------------------
# vpn-bot.amn-boris.ru — VPN Boriska Bot (bot/ + api/), develop-стенд
#
# Это НЕ самостоятельный nginx.conf, а фрагмент конфига для общего
# edge-nginx (см. boriska_guard_infra/roles/nginx_edge), уже поднятого
# на vps-01 (amn-boris.ru) через ansible. На сервере деплоится в
# /opt/nginx-edge/conf.d/vpn-bot.conf и подхватывается базовым
# http{}-блоком через `include /etc/nginx/conf.d/*.conf;` — ставится
# В ДОПОЛНЕНИЕ к базовому nginx.conf, который туда кладёт роль nginx_edge,
# а не вместо него.
#
# HTTP->HTTPS редирект и ACME-challenge уже реализованы в базовом
# конфиге (server{ listen 80; server_name _; }) — здесь их дублировать
# не нужно. resolver для Docker DNS (127.0.0.11) тоже уже задан в базовом
# http{}, поэтому upstream'ы ниже резолвятся через переменные ($upstream_*),
# чтобы nginx не падал при перезагрузке, если vpn_bot/api ещё не подняты.
#
# Локальная разработка (docker-compose.local.yml) этот файл больше не
# использует — там теперь nginx_local.conf (полноценный standalone nginx.conf).
# ---------------------------------------------------------

limit_req_zone $binary_remote_addr zone=vpnbot_req_limit:10m rate=10r/s;

map $http_user_agent $vpnbot_bad_ua {
    default 0;
    ~*(sqlmap|nikto|nmap|zgrab|dirbuster|masscan|wpscan|curl|wget|python) 1;
}

server {
    listen 443 ssl;
    http2 on;
    server_name vpn-bot.amn-boris.ru;

    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/vpn-bot.amn-boris.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vpn-bot.amn-boris.ru/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:AES128-GCM-SHA256';
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1h;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    limit_req zone=vpnbot_req_limit burst=20 nodelay;
    limit_conn conn_limit_per_ip 20;

    if ($vpnbot_bad_ua) {
        return 403;
    }

    # -----------------------------------------------------
    # Защита от доступа к скрытым/конфигурационным файлам
    # -----------------------------------------------------
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~* \.(env|ini|log|conf|yml|yaml|sql|bak|old)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~* ^/(?:etc|proc|sys|root|home|var|boot|usr)/ {
        deny all;
    }

    # -----------------------------------------------------
    # Telegram Webhook (разрешены только IP Telegram)
    # -----------------------------------------------------
    location = /bot/webhook {
        allow 91.108.0.0/16;
        allow 149.154.160.0/20;
        deny all;

        set $upstream_bot http://vpn_bot:8088;
        proxy_pass $upstream_bot;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # -----------------------------------------------------
    # Проксирование bot/ и api/ — по имени контейнера в edge_net
    # -----------------------------------------------------
    location /bot/ {
        set $upstream_bot http://vpn_bot:8088;
        proxy_pass $upstream_bot;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
    }

    # /api/admin/statics/ отдаёт сам SQLAdmin (Mount("/statics", ...) в
    # sqladmin/application.py) — edge-nginx не имеет доступа к volume с
    # файлами api-контейнера, поэтому отдельный alias-location не нужен.
    location /api/ {
        set $upstream_api http://api:8089;
        proxy_pass $upstream_api;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
    }
}
