# === CORE ===
[core]
# По умолчанию 10 конфиг файлов для полльзователя.
max_configs_per_user = 10
#Настроки сервера на которм контейнер с VPN для подключения к нему.
#Дефолтное время для Timeout ошибки при подключени к стороннему сревису
common_timeout = 10
# IANA-имя таймзоны проекта — единая точка настройки для всех datetime.now()
# в bot/ и api/ (см. #255).
timezone = "Europe/Moscow"

admin_ids = [439653349,]
trial_period_days = 7
# === LOGGER ===
# *Уровни логирования по умолчанию INFO, INFO WARNING
logger_level_stdout = "INFO"
logger_level_file = "INFO"
logger_error_file = "WARNING"
logger_diagnose_files = false
# Пишет ли UserActionLoggingMiddleware полный repr событий (переписку) в лог (см. #286).
log_user_events_data = false


# === FASTAPI ===
# *Настройки FastAPI по умолчанию оба False
debug_fast_api = false
reload_fast_api = false

# === BOT ===
[bot]

# ! Базовый URL сайта (например, для webhook)
base_site = "https://vpn-bot.boris-guard.pro/bot"
# *Использовать webhook или polling по умолчанию polling false
use_polling = false

# === SCHEDULER ===
[scheduler]
# Прод: interval_seconds не задан → используется cron-расписание ниже.
cron_hour = 8
cron_minute = 0

# === PRICING ===
[pricing]
# Цена за тарифы 1, 3, 6, 12 месяцев и триал период на 7 дней
price_map = {1 = 149, 3 = 399, 6 = 749, 12 = 1390}
price_map_premium = {1 = 249, 3 = 699, 6 = 1290, 12 = 2490}
price_map_founder = {1 = 199, 3 = 549, 6 = 1049, 12 = 1990}

# === PAYMENT ===
[payment]
# Platega перекладывает комиссию эквайринга на клиента — в вебхуке
# приходит сумма с комиссией сверху. Список известных ставок, по которым
# сверка суммы вебхука считает платёж подтверждённым (без правки кода,
# если провайдер введёт новую ставку — просто добавить сюда).
gateway_commission_rates = [0.11, 0.12]


# === API ===
[api]
url = "api"
#API по умолчанию api c портом 8089
port = 8089

# === BOT CHANNEL ===
[bot_channel]
url = "vpn_bot"

# === VPN SERVERS ===
# Формат каждой секции: [base] → [xray] → [[xray.inbounds]]
# premium = true  → нода доступна только премиум-пользователям
# enabled = false → нода скрыта из бота, но остаётся в конфиге

# ── 🇫🇷  FR — Франция │ vps02 │ DISABLED ──────────────────────────────────
# Бот переехал на vps-05; нода остаётся для ssh-доступа к серверу
[vpn.nodes.fr]
host             = "vps02.boris-guard.pro"
username         = "boris02"
#container_old    = "amnezia-awg"
container        = "amnezia-awg2"
protocol_version = "v3"
use_local        = false
location_prefix  = "FR"
flag             = "🇫🇷"
enabled          = true
amnezia_enabled  = true
premium          = true
#
[vpn.nodes.fr.xray]
host                = "vps02-sub.boris-guard.pro"
panel_host          = "vps02-panel.boris-guard.pro"
panel_prefix        = "panel-45gh65"
subscription_prefix = "sub-45gh45"
panel_port          = 5443
subscription_port   = 2096
username            = "admin"
enabled             = true

[[vpn.nodes.fr.xray.inbounds]]
port     = 6443
name     = "🇫🇷 | XHTTP"
protocol = "vless_reality_xhttp"

[[vpn.nodes.fr.xray.inbounds]]
port     = 9443
name     = "🇫🇷 | TCP Reality"
protocol = "vless_reality_tcp"

