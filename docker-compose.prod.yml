services:
  vpn_bot:
    env_file:
      - .env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - $SSH_AUTH_SOCK:/ssh-agent
    environment:
      - SSH_AUTH_SOCK=/ssh-agent
    ports:
      - "127.0.0.1:8088:8088"
    healthcheck:
      test: [ "CMD", "python", "-c", "import requests; requests.get('http://localhost:8088/bot/health', timeout=2)" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - infrastructure_net
      - edge_net
  api:
    env_file:
      - .env
    ports:
      - "127.0.0.1:8089:8089"
    healthcheck:
      test: [ "CMD", "python", "-c", "import requests; requests.get('http://localhost:8089/api/health', timeout=2)" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - infrastructure_net
      - edge_net
networks:
  infrastructure_net:
    name: infrastructure_net
    driver: bridge
    external: true
  # Общая сеть с edge-nginx (boriska_guard_infra) — нужна, чтобы nginx_edge
  # мог проксировать на vpn_bot/api по имени контейнера (см. nginx.conf).
  edge_net:
    name: edge_net
    external: true
