# На vps-01 (amn-boris.ru) bot/api живут за общим edge-nginx (boriska_guard_infra,
# см. nginx_test.conf — теперь conf.d-фрагмент, не полноценный nginx.conf), поэтому
# свой nginx_vpn_bot здесь больше не поднимается (см. makefile: PROFILE_FLAG для
# STAGE=develop пустой, как и для prod). Для standalone-нужд локальной разработки —
# docker-compose.local.yml + nginx_local.conf.
services:
  vpn_bot:
    env_file:
      - .env.dev
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - $SSH_AUTH_SOCK:/ssh-agent
    environment:
      - SSH_AUTH_SOCK=/ssh-agent
    ports:
      - "127.0.0.1:8088:8088"
    healthcheck:
      test: [ "CMD", "python", "-c", "import requests; requests.get('http://localhost:8088/bot/health', timeout=2)" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - infrastructure_net
      - edge_net
  api:
    env_file:
      - .env.dev
    ports:
      - "127.0.0.1:8089:8089"
    healthcheck:
      test: [ "CMD", "python", "-c", "import requests; requests.get('http://localhost:8089/api/health', timeout=2)" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - infrastructure_net
      - edge_net
networks:
  infrastructure_net:
    name: infrastructure_net
    driver: bridge
    external: true
  # Общая сеть с edge-nginx (boriska_guard_infra) — нужна, чтобы nginx_edge
  # мог проксировать на vpn_bot/api по имени контейнера (см. nginx_test.conf).
  edge_net:
    name: edge_net
    external: true
