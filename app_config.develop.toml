# === CORE ===
[core]
# По умолчанию 10 конфиг файлов для полльзователя.
max_configs_per_user = 2
#Настроки сервера на которм контейнер с VPN для подключения к нему.
#Дефолтное время для Timeout ошибки при подключени к стороннему сревису
common_timeout = 10
# IANA-имя таймзоны проекта — единая точка настройки для всех datetime.now()
# в bot/ и api/ (см. #255).
timezone = "Europe/Moscow"


admin_ids = [439653349, ]
trial_period_days = 2

# === LOGGER ===
# Уровни логирования по умолчанию INFO, INFO WARNING
logger_level_stdout = "DEBUG"
logger_level_file = "DEBUG"
logger_error_file = "WARNING"
logger_diagnose_files = false
# Пишет ли UserActionLoggingMiddleware полный repr событий (переписку) в лог (см. #286).
log_user_events_data = false


# === FASTAPI ===
# *Настройки FastAPI по умолчанию оба False
debug_fast_api = false
reload_fast_api = false

# === BOT ===
[bot]
# ! Базовый URL сайта (например, для webhook)
base_site = "https://vpn-bot.dev.boris-guard.pro/bot"
# *Использовать webhook или polling по умолчанию polling false
use_polling = false

# === SCHEDULER ===
[scheduler]
# Dev/local: проверка каждые N секунд вместо cron — удобно для отладки.
# Чтобы вернуть боевое поведение здесь, просто уберите interval_seconds
# (или переопределите его в app_config.local.toml).
#interval_seconds = 30

# === PRICING ===
[pricing]
# Цена за тарифы 1, 3, 6, 12 месяцев и триал период на 7 дней
price_map = { 1 = 149, 3 = 399, 6 = 749, 12 = 1390 }
price_map_premium = { 1 = 249, 3 = 699, 6 = 1290, 12 = 2490 }
price_map_founder = { 1 = 199, 3 = 549, 6 = 1049, 12 = 1990 }

# === PAYMENT ===
[payment]
# Platega перекладывает комиссию эквайринга на клиента — в вебхуке
# приходит сумма с комиссией сверху. Список известных ставок, по которым
# сверка суммы вебхука считает платёж подтверждённым (без правки кода,
# если провайдер введёт новую ставку — просто добавить сюда).
gateway_commission_rates = [0.11, 0.12]

# === API ===
[api]
url = "api"
#API по умолчанию api c портом 8089
port = 8089

# === BOT CHANNEL ===
[bot_channel]
url = "vpn_bot"

# === VPN SERVERS ===
# Формат каждой секции: [base] → [xray] → [[xray.inbounds]]
# premium = true  → нода доступна только премиум-пользователям
# enabled = false → нода скрыта из бота, но остаётся в конфиге

# ── 🇩🇪  DE — Германия │ vps01 │ dev (бот) ────────────────────────────────
# Сервер, на котором крутится бот — для него доступно локальное подключение
[vpn.nodes.de]
host = "vps01.boris-guard.pro"
username = "boris01"
#container_old    = "amnezia-awg"
container = "amnezia-awg2"
protocol_version = "v3"
use_local = true
location_prefix = "DE"
flag = "🇩🇪"
enabled = true
amnezia_enabled = true

[vpn.nodes.de.xray]
host = "vps01-sub.boris-guard.pro"
panel_host = "vps01-panel.boris-guard.pro"
panel_prefix = "panel-45gh65"
subscription_prefix = "sub-45gh45"
panel_port = 5443
subscription_port = 2096
username = "admin"
enabled = true

[[vpn.nodes.de.xray.inbounds]]
port = 2054
name = "🇩🇪 | XHTTP Test"
protocol = "vless_reality_xhttp"

[[vpn.nodes.de.xray.inbounds]]
port = 2055
name = "🇩🇪 | TCP Reality Test"
protocol = "vless_reality_tcp"


# ── 🇧🇬  SOF — Болгария (София) │ vps03 │ premium ──────────────────────────
[vpn.nodes.sof]
host = "vps03-awg.boris-guard.pro"
username = "boris03"
container = "amnezia-awg2"
protocol_version = "v2"
use_local = false
location_prefix = "SOF"
flag = "🇧🇬"
enabled = true
amnezia_enabled = true
premium = true

[vpn.nodes.sof.xray]
host = "x-ray-boriska.pro"
panel_host = "vps03-panel.boris-guard.pro"
panel_prefix = "panel-df06dg"
subscription_prefix = "sub-dk-34gs"
panel_port = 5443
subscription_port = 2096
username = "admin"
enabled = true

[[vpn.nodes.sof.xray.inbounds]]
port = 2054
name = "🇧🇬 | XHTTP Test"
protocol = "vless_reality_xhttp"

[[vpn.nodes.sof.xray.inbounds]]
port = 2055
name = "🇧🇬 | TCP Reality Test"
protocol = "vless_reality_tcp"

# === REMNAWAVE ===
[remnawave]
api_url = "remnawave-panel.boris-guard.pro"
api_port = 443
api_scheme = "https"
api_prefix = "/api"
enabled = true

[remnawave.squads]
admin = ["e64fe59d-e4f6-493f-9ed5-f63d836ea771"]
standard = ["9f4ef83d-bea5-4801-abc6-19bfac67dd37"]
premium = ["9f4ef83d-bea5-4801-abc6-19bfac67dd37", "43536187-6bab-4477-bf3f-44c31531118e"]
founder = ["9f4ef83d-bea5-4801-abc6-19bfac67dd37", "0ee70061-5194-4f6a-91f7-18e6333510bf"]

[remnawave.tier_map]
trial = "standard"
standard = "standard"
premium = "premium"
founder = "founder"
ultimate = "premium"
admin = "admin"

# === DB ===
[db]
# * Настройки базы данных PostgreSQL по умолчанию postgres
host = "postgres"
# по умолчани порт 5432
port = 5432
user = "user_vpn"
database = "vpn_boriska_db"
#Размерность для эмбеддингов по умолчанию Яндекс использует 256  и на локально модели тот же парметр
embedding_dim = 256

# === REDIS ===
[redis]
# *Контекнер Redis по умолчанию redis
host = "redis"
# по умолчанию порт 6379
port = 6379
# по умолачанию пишит все в 0 базу
db = 1
# по умолчанию 43200 секунд или 12 часов время жизни кэша редис
default_expire = 43200
user = "vpn_user"


# === STORAGE ===
[bucket]
#Bucket настройки
bucket_name = "vpn-bot-images"
prefix = "media/"
endpoint_url = "https://storage.yandexcloud.net"

# === AI ===
[ai]
#AI модель указвать только на локальной разработке так все через яндекс идет
#Размерность для эмбеддингов 256 такую LLM нало брать, что б в БД положить
model_name = "intfloat/multilingual-e5-small"
#по умослчани нормализация TRUE
normalize = true
